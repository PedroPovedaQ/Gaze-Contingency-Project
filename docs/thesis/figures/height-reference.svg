<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#617078"/></marker></defs><rect width="1000" height="100%" fill="white"/><text x="35" y="35.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173c48">Vertical demand has an explicit reference</text><text x="35" y="66.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#617078">Proposed allocation uses cross-relative height, distinct from live eye-to-target guidance.</text><line x1="80" y1="440" x2="520" y2="440" stroke="#617078" stroke-width="2.5"/><text x="80" y="475.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#617078">Side elevation</text><line x1="200" y1="135" x2="200" y2="440" stroke="#617078" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="175" y1="300" x2="225" y2="300" stroke="#245b78" stroke-width="5"/><line x1="200" y1="275" x2="200" y2="325" stroke="#245b78" stroke-width="5"/><text x="55" y="270.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="normal" fill="#173c48">Cross c</text><circle cx="450" cy="170" r="12" fill="#fff0c7" stroke="#c89416" stroke-width="3"/><text x="350" y="140.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="normal" fill="#173c48">Target p above c</text><line x1="230" y1="300" x2="485" y2="300" stroke="#617078" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="230" y1="170" x2="485" y2="170" stroke="#617078" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="490" y1="295" x2="490" y2="175" stroke="#c89416" stroke-width="2.5" marker-end="url(#a)"/><text x="500" y="242.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#c89416">Δh</text><rect x="610" y="105" width="350" height="140" rx="12" fill="#fff0c7" stroke="#bac6cc"/><text x="628" y="137.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Planned measured blocks</text><text x="628" y="170.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">20 targets above / 20 below</text><text x="628" y="195.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Near-zero rule remains open</text><text x="628" y="221.3" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Allocation not yet enforced</text><rect x="610" y="285" width="350" height="145" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="628" y="317.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Live refinement</text><text x="628" y="350.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Uses current gaze geometry</text><text x="628" y="375.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">A neighboring highlight is not</text><text x="628" y="401.3" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">automatically its reference</text><text x="45" y="520.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="normal" fill="#173c48">Δh = target height − cross height; preserve sign and the saved reference.</text></svg>
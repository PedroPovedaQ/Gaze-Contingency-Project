<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#617078"/></marker></defs><rect width="1000" height="100%" fill="white"/><text x="35" y="35.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173c48">Repeated trials do not replace independent participants</text><text x="35" y="66.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#617078">Proposed analysis: within-participant contrast with explicit clustering and observation scope.</text><rect x="25" y="105" width="950" height="400" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="43" y="137.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Participant i</text><rect x="60" y="165" width="410" height="120" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="78" y="197.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Voice condition A</text><text x="78" y="230.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">40 trial outcomes with starting geometry</text><text x="78" y="255.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">1 set of block-referenced ratings</text><rect x="530" y="165" width="410" height="120" rx="12" fill="#fff0c7" stroke="#bac6cc"/><text x="548" y="197.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Voice condition B</text><text x="548" y="230.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">40 trial outcomes with starting geometry</text><text x="548" y="255.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">1 set of block-referenced ratings</text><line x1="270" y1="285" x2="400" y2="340" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><line x1="730" y1="285" x2="600" y2="340" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><rect x="230" y="340" width="540" height="115" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="248" y="372.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Paired contribution to the study estimate</text><text x="248" y="405.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Counterbalanced order + participant clustering</text><text x="248" y="430.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Separate performance and questionnaire models</text><text x="500" y="545.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="normal" fill="#173c48">Repeat across participants; determine sample size through a prospective power analysis.</text></svg>
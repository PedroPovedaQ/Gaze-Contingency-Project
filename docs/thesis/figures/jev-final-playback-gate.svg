    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #173c48" x="159.6096" y="332.313695" transform="rotate(-0 159.6096 332.313695)">Candidate for playback</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173c48" x="38.952" y="371.304548" transform="rotate(-0 38.952 371.304548)">4  LOCAL SCHEDULER + FINAL PLAYBACK GATE</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(38.952 391.121848)">Same trial and voice; request still current and not canceled?</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(38.952 406.871848)">Current evidence still qualifies this action and direction?</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(38.952 422.621848)">No contradictory cue while the controller is on the target?</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(38.952 438.371848)">Prepared clip ready; speech timing and repetition rules satisfied?</text>
   </g>

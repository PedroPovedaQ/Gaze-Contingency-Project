   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173c48" x="38.952" y="43.836525" transform="rotate(-0 38.952 43.836525)">1  UNITY: observe and update state</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(38.952 63.652888)">Target geometry; gaze validity and object hits; controller aim; trial state</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(38.952 79.402888)">Recent spoken phrases and transitions; audio playback status</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173c48" x="38.952" y="142.902765" transform="rotate(-0 38.952 142.902765)">2  Filter eligible choices</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(38.952 162.719128)">Keep directions valid for this state.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(38.952 178.469128)">Send a snapshot and recent history.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(38.952 194.219128)">Ordinary request: 2–5 phrase options.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173c48" x="337.4208" y="142.902765" transform="rotate(-0 337.4208 142.902765)">Qualified local feedback</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(337.4208 162.719128)">Gaze / pointing acknowledgments</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(337.4208 178.469128)">and eligible turn milestones can</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(337.4208 194.219128)">bypass a new Jev request.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173c48" x="38.952" y="250.224525" transform="rotate(-0 38.952 250.224525)">3  JEV: advise asynchronously</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(38.952 270.040888)">Choose wording and speak / wait.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(38.952 285.790888)">Development mode can also choose</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(38.952 301.540888)">an eligible action. Wait is bounded.</text>
   </g>
   <g id="text_9">
    <g id="patch_17">
     <path d="M 382.497228 288.539648 
L 533.659572 288.539648 
L 533.659572 254.213632 
L 382.497228 254.213632 
z
" style="fill: #ffffff"/>
    </g>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(395.953322 267.632988)">No new model request</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(386.457228 280.835995)">does not bypass the gate.</text>
   </g>

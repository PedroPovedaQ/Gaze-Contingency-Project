    </g>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(620.576625 313.169646) rotate(-90)">Fresh Unity state at playback</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173c48" x="38.952" y="511.649325" transform="rotate(-0 38.952 511.649325)">Not admitted: do not play now</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(38.952 531.465688)">Discard stale or invalid proposals;</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(38.952 547.215688)">reconsider timing when appropriate.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173c48" x="337.4208" y="511.649325" transform="rotate(-0 337.4208 511.649325)">Admitted: play prepared audio</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(337.4208 531.465688)">Record actual playback and update</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #173c48" transform="translate(337.4208 547.215688)">speech memory; ElevenLabs voice.</text>
   </g>

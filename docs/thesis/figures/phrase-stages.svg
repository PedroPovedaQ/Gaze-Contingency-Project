<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="512" viewBox="0 0 1000 512"><rect width="1000" height="512" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a969c"/></marker></defs><text x="20" y="24.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1f2a30">Coarse: find the object plane</text><rect x="20" y="34" width="232" height="130" rx="8" fill="#eef1f3" stroke="#a9b4ba" stroke-width="1.4"/><text x="32" y="58.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1f2a30">Readiness</text><text x="32" y="78.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#56636b">Before each trial</text><text x="32" y="102.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“Look at the cross and</text><text x="32" y="121.2" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">hold your gaze to begin</text><text x="32" y="140.4" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">the next round.”</text><line x1="253" y1="99.0" x2="262" y2="99.0" stroke="#8a969c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="263" y="34" width="232" height="130" rx="8" fill="#eef1f3" stroke="#a9b4ba" stroke-width="1.4"/><text x="275" y="58.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1f2a30">Opening cue</text><text x="275" y="78.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#56636b">Objects still hidden</text><text x="275" y="102.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“The object is to the</text><text x="275" y="121.2" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">left.”</text><line x1="496" y1="99.0" x2="505" y2="99.0" stroke="#8a969c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="506" y="34" width="232" height="130" rx="8" fill="#eef1f3" stroke="#a9b4ba" stroke-width="1.4"/><text x="518" y="58.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1f2a30">Turning</text><text x="518" y="78.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#56636b">Yaw only</text><text x="518" y="102.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“Turn way left.”</text><text x="518" y="121.2" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“Keep turning left.”</text><line x1="739" y1="99.0" x2="748" y2="99.0" stroke="#8a969c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="749" y="34" width="232" height="130" rx="8" fill="#eef1f3" stroke="#a9b4ba" stroke-width="1.4"/><text x="761" y="58.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1f2a30">Arrival</text><text x="761" y="78.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#56636b">Pitch joins in</text><text x="761" y="102.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“Right area. A little</text><text x="761" y="121.2" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">higher.”</text><text x="20" y="194.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1f2a30">Fine: find the object</text><rect x="20" y="204" width="232" height="130" rx="8" fill="#eef1f3" stroke="#a9b4ba" stroke-width="1.4"/><text x="32" y="228.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1f2a30">Refinement</text><text x="32" y="248.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#56636b">Yaw and pitch</text><text x="32" y="272.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“Look way higher.”</text><text x="32" y="291.2" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“A little higher and left.”</text><line x1="253" y1="269.0" x2="262" y2="269.0" stroke="#8a969c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="263" y="204" width="232" height="130" rx="8" fill="#eef1f3" stroke="#a9b4ba" stroke-width="1.4"/><text x="275" y="228.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1f2a30">Progress</text><text x="275" y="248.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#56636b">After measured progress</text><text x="275" y="272.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“Keep going to the left.”</text><text x="275" y="291.2" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“A bit more.”</text><line x1="496" y1="269.0" x2="505" y2="269.0" stroke="#8a969c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="506" y="204" width="232" height="130" rx="8" fill="#eef1f3" stroke="#a9b4ba" stroke-width="1.4"/><text x="518" y="228.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1f2a30">On target</text><text x="518" y="248.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#56636b">Gaze or pointing</text><text x="518" y="272.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“Right there.”</text><text x="518" y="291.2" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“Yep, that's it!”</text><line x1="739" y1="269.0" x2="748" y2="269.0" stroke="#8a969c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="749" y="204" width="232" height="130" rx="8" fill="#eef1f3" stroke="#a9b4ba" stroke-width="1.4"/><text x="761" y="228.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1f2a30">Selection</text><text x="761" y="248.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#56636b">If the trigger is not used</text><text x="761" y="272.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“Aim at it with your right</text><text x="761" y="291.2" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">controller and press</text><text x="761" y="310.4" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">the trigger.”</text><text x="20" y="364.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1f2a30">As needed during a trial, and at the end</text><rect x="20" y="374" width="232" height="130" rx="8" fill="#eef1f3" stroke="#a9b4ba" stroke-width="1.4"/><text x="32" y="398.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1f2a30">Correction</text><text x="32" y="418.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#56636b">Overshoot or departure</text><text x="32" y="442.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“Go back a little to the</text><text x="32" y="461.2" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">left.”</text><rect x="263" y="374" width="232" height="130" rx="8" fill="#eef1f3" stroke="#a9b4ba" stroke-width="1.4"/><text x="275" y="398.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1f2a30">Wrong selection</text><text x="275" y="418.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#56636b">A tone, then speech</text><text x="275" y="442.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“Try another object.”</text><rect x="506" y="374" width="232" height="130" rx="8" fill="#eef1f3" stroke="#a9b4ba" stroke-width="1.4"/><text x="518" y="398.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1f2a30">Timeout</text><text x="518" y="418.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#56636b">25-second deadline</text><text x="518" y="442.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“Time up. Let's shake</text><text x="518" y="461.2" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">that round off and start</text><text x="518" y="480.4" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">the next.”</text><rect x="749" y="374" width="232" height="130" rx="8" fill="#eef1f3" stroke="#a9b4ba" stroke-width="1.4"/><text x="761" y="398.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1f2a30">Success</text><text x="761" y="418.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#56636b">Correct selection</text><text x="761" y="442.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">“Nice work. You found it</text><text x="761" y="461.2" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1f2a30">on your first selection.”</text></svg>
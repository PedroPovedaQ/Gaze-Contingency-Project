<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><rect width="1000" height="330" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56636b"/></marker></defs><rect x="30" y="20" width="420" height="110" rx="10" fill="#f8e6c0" stroke="#E8B44F" stroke-width="2"/><text x="240.0" y="60.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#1f2a30">Generic Agent Voice</text><text x="240.0" y="92.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#1f2a30">(User chooses from a catalog of voices)</text><rect x="550" y="20" width="420" height="110" rx="10" fill="#d4e1f4" stroke="#7199D6" stroke-width="2"/><text x="760.0" y="60.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#1f2a30">Self-Similar Voice</text><text x="760.0" y="92.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#1f2a30">(Voice is matched to the user)</text><line x1="240.0" y1="132" x2="372.0" y2="202" stroke="#56636b" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="760.0" y1="132" x2="628.0" y2="202" stroke="#56636b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="180.0" y="205" width="640" height="110" rx="10" fill="#eef1f3" stroke="#a9b4ba" stroke-width="2"/><text x="500.0" y="245.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#1f2a30">Shared LLM-Based Guidance System</text><text x="500.0" y="277.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#1f2a30">(Audio-based cues from trial state and target object location)</text></svg>
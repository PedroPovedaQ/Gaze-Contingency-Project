<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#617078"/></marker></defs><rect width="1000" height="100%" fill="white"/><text x="35" y="35.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173c48">Guidance states and evidence</text><text x="35" y="66.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#617078">Implemented state families; arrows show common paths, not an exhaustive transition graph.</text><rect x="35" y="100" width="280" height="85" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="53" y="132.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Opening</text><text x="53" y="165.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Cue before reveal</text><rect x="360" y="100" width="280" height="85" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="378" y="132.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Turning</text><text x="378" y="165.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Outside target wall</text><rect x="685" y="100" width="280" height="85" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="703" y="132.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Refining</text><text x="703" y="165.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Within target wall</text><line x1="315" y1="143" x2="360" y2="143" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><line x1="640" y1="143" x2="685" y2="143" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><rect x="685" y="245" width="280" height="100" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="703" y="277.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">AcquiringTarget</text><text x="703" y="310.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Valid winning vicinity;</text><text x="703" y="335.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">qualification in progress</text><line x1="825" y1="185" x2="825" y2="245" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><rect x="360" y="245" width="280" height="100" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="378" y="277.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Acquired</text><text x="378" y="310.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Qualified gaze evidence;</text><text x="378" y="335.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">no selection implied</text><line x1="685" y1="295" x2="640" y2="295" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><rect x="35" y="245" width="280" height="100" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="53" y="277.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">ReadyToSelect</text><text x="53" y="310.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Qualified controller hold</text><text x="53" y="335.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">with required gaze evidence</text><line x1="360" y1="295" x2="315" y2="295" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><rect x="35" y="400" width="440" height="100" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="53" y="432.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Evidence can change the stage</text><text x="53" y="465.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Overshoot, departure, and reacquisition</text><text x="53" y="490.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">can return guidance to an earlier state.</text><rect x="525" y="400" width="440" height="100" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="543" y="432.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Paused / Suspended</text><text x="543" y="465.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Pause or invalid/stale gaze suspends</text><text x="543" y="490.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">new gaze-dependent instructions.</text><rect x="35" y="550" width="930" height="95" rx="12" fill="#fff0c7" stroke="#bac6cc"/><text x="53" y="582.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Completed · Stopped · Inactive</text><text x="53" y="615.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Correct trigger selection can complete any active search stage; acknowledgments are not prerequisites.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#617078"/></marker></defs><rect width="1000" height="100%" fill="white"/><text x="35" y="35.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173c48">From evidence to software playback</text><text x="35" y="66.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#617078">Conceptual timing diagram; horizontal lengths are illustrative, not latency measurements.</text><line x1="75" y1="260" x2="940" y2="260" stroke="#617078" stroke-width="4" marker-end="url(#a)"/><circle cx="75" cy="260" r="7" fill="#245b78" stroke="#245b78" stroke-width="3"/><text x="75" y="190.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#173c48">First valid</text><text x="75" y="217.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#173c48">evidence</text><circle cx="255" cy="260" r="7" fill="#245b78" stroke="#245b78" stroke-width="3"/><text x="255" y="190.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#173c48">Qualification</text><text x="255" y="217.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#173c48">tq</text><circle cx="490" cy="260" r="7" fill="#245b78" stroke="#245b78" stroke-width="3"/><text x="490" y="190.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#173c48">Decision /</text><text x="490" y="217.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#173c48">admission</text><circle cx="720" cy="260" r="7" fill="#245b78" stroke="#245b78" stroke-width="3"/><text x="720" y="190.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#173c48">Final live</text><text x="720" y="217.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#173c48">recheck</text><circle cx="925" cy="260" r="7" fill="#245b78" stroke="#245b78" stroke-width="3"/><text x="925" y="190.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#173c48">Playback</text><text x="925" y="217.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#173c48">tp</text><line x1="80" y1="330" x2="250" y2="330" stroke="#8a630a" stroke-width="7"/><text x="165" y="367.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#173c48">Qualification gate</text><line x1="260" y1="330" x2="920" y2="330" stroke="#245b78" stroke-width="7"/><text x="590" y="367.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#173c48">Software delay: tp − tq</text><rect x="75" y="405" width="850" height="85" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="93" y="437.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Attribution requires recorded events</text><text x="93" y="470.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Model response, model wait, scheduling, existing speech, and audio readiness can overlap.</text><text x="500" y="105.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="normal" fill="#173c48">Qualified local feedback can bypass a new Jev request.</text></svg>
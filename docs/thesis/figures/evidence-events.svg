<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#617078"/></marker></defs><rect width="1000" height="100%" fill="white"/><text x="35" y="35.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173c48">Three different events</text><text x="35" y="66.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#617078">Implemented interaction gates; neither ray contact nor vicinity qualification establishes fixation.</text><rect x="30" y="110" width="290" height="120" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="48" y="142.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Gaze acknowledgment</text><text x="48" y="175.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Valid winning vicinity</text><line x1="320" y1="165" x2="355" y2="165" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><rect x="355" y="110" width="350" height="120" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="373" y="142.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">100 ms qualifying evidence</text><text x="373" y="175.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Distinct event and timestamp</text><line x1="705" y1="165" x2="740" y2="165" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><text x="745" y="155.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#173c48">“You are looking at it.”</text><rect x="30" y="270" width="290" height="120" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="48" y="302.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Controller acknowledgment</text><text x="48" y="335.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Right ray intersects target</text><line x1="320" y1="325" x2="355" y2="325" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><rect x="355" y="270" width="350" height="120" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="373" y="302.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">1 s hold + valid nearby gaze</text><text x="373" y="335.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Distinct event and timestamp</text><line x1="705" y1="325" x2="740" y2="325" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><text x="745" y="315.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#173c48">“You are pointing at it.”</text><rect x="30" y="430" width="290" height="120" rx="12" fill="#fff0c7" stroke="#bac6cc"/><text x="48" y="462.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Trial completion</text><text x="48" y="495.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Correct right-trigger selection</text><line x1="320" y1="485" x2="355" y2="485" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><rect x="355" y="430" width="350" height="120" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="373" y="462.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Trigger confirms selection</text><text x="373" y="495.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48
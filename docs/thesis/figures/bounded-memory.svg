<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#617078"/></marker></defs><rect width="1000" height="100%" fill="white"/><text x="35" y="35.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173c48">Bounded memory passed with current state</text><text x="35" y="66.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#617078">Implemented limits are engineering settings, not cognitive-memory estimates.</text><rect x="35" y="105" width="450" height="180" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="53" y="137.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Spatial history</text><text x="53" y="170.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Up to 3 s / 384 observations</text><text x="53" y="195.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Target-relative gaze and turn progress</text><text x="53" y="221.3" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Clears on invalidity, source change,</text><text x="53" y="246.95" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">or observation gap greater than 100 ms</text><rect x="515" y="105" width="450" height="180" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="533" y="137.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Speech and transition history</text><text x="533" y="170.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">At most 4 speech + 4 state entries</text><text x="533" y="195.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Request excludes entries older than 15 s</text><text x="533" y="221.3" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Tracks actual speech and transitions</text><text x="533" y="246.95" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Clears when guidance resets</text><line x1="260" y1="285" x2="420" y2="350" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><line x1="740" y1="285" x2="580" y2="350" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><rect x="250" y="350" width="500" height="95" rx="12" fill="#fff0c7" stroke="#bac6cc"/><text x="268" y="382.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Immutable request snapshot</text><text x="268" y="415.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Current evidence + eligible choices + memory</text><line x1="500" y1="445" x2="500" y2="490" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><text x="500" y="525.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Recheck live state before any returned choice plays</text></svg>
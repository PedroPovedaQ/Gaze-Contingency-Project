<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#617078"/></marker></defs><rect width="1000" height="100%" fill="white"/><text x="35" y="35.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173c48">Evidence and derived data remain separate</text><text x="35" y="66.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#617078">Implemented recording architecture with proposed analysis and validation requirements.</text><rect x="35" y="110" width="280" height="130" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="53" y="142.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Source records</text><text x="53" y="175.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Gaze, head, controller poses</text><text x="53" y="200.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Object layout and identifiers</text><text x="53" y="226.3" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Events and playback starts</text><line x1="315" y1="175" x2="365" y2="175" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><rect x="365" y="110" width="270" height="130" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="383" y="142.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Versioned processing</text><text x="383" y="175.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Clock and validity checks</text><text x="383" y="200.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Trial and block joins</text><text x="383" y="226.3" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Missingness preserved</text><line x1="635" y1="175" x2="685" y2="175" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><rect x="685" y="110" width="280" height="130" rx="12" fill="#fff0c7" stroke="#bac6cc"/><text x="703" y="142.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Trial summaries</text><text x="703" y="175.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Performance and geometry</text><text x="703" y="200.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Questionnaire references</text><text x="703" y="226.3" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Provenance and versions</text><line x1="175" y1="240" x2="175" y2="320" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><rect x="35" y="320" width="410" height="115" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="53" y="352.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Trial Review reconstruction</text><text x="53" y="385.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Timeline, scene, state, and speech</text><text x="53" y="410.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Uses original observations and events</text><line x1="825" y1="240" x2="825" y2="320" stroke="#617078" stroke-width="2.5" marker-end="url(#a)"/><rect x="555" y="320" width="410" height="115" rx="12" fill="#eef3f5" stroke="#bac6cc"/><text x="573" y="352.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#173c48">Analysis tables</text><text x="573" y="385.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Trials nested within participants</text><text x="573" y="410.65" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="normal" fill="#173c48">Ratings retain participant × block scope</text><text x="500" y="510.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#173c48">Derived CSV rows do not replace raw records.</text><text x="500" y="538.35" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#173c48">Repeating a block score across 24 rows does not create 40 ratings.</text></svg>